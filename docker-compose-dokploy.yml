# docker-compose-dokploy.yml
#
# Deployment manifest for Dokploy. Pulls the pre-built image from GHCR (no
# local build) and injects runtime env from a sibling `.env` file. NEXT_PUBLIC_*
# values are already baked in by the GHCR build; everything else (DATABASE_URL,
# secrets, API keys) is supplied at start-time so secrets aren't burned into
# the image.
#
# Ingress: Cloudflare Tunnel routes the public hostname
# (https://socialconnect.neverest.co.ke) to http://localhost:3002 on this
# host, so this compose binds the container's port 3000 to host port 3002.
# No Traefik labels needed; the tunnel terminates TLS at Cloudflare.
#
# How Dokploy uses this file:
#   1. Point a Compose service at this path in the Dokploy dashboard.
#   2. In the project's "Environment" tab, define every var listed in
#      .env.example (DATABASE_URL, BETTER_AUTH_SECRET, TINYPESA_*, RESEND_*, …).
#      Dokploy writes those values into a `.env` file next to this manifest
#      before running `docker compose up`.
#   3. Set BETTER_AUTH_URL and NEXT_PUBLIC_BETTER_AUTH_URL to the Cloudflare
#      hostname (https://socialconnect.neverest.co.ke), NOT localhost:3002.
#      Better Auth signs cookies against the public origin.
#   4. Add ghcr.io registry credentials in Dokploy → Settings → Registries
#      so it can pull the private image. Or make the image public on GHCR.
#
# Local sanity check:
#   docker compose -f docker-compose-dokploy.yml --env-file .env up
#   curl http://localhost:3002/login
#
services:
  web:
    image: ghcr.io/denogeek/socialconnect:socialconnect-latest
    # Always pull on deploy so re-running with the same tag actually moves forward.
    pull_policy: always
    restart: unless-stopped

    # Runtime env. Server code reads process.env on every request, so changes
    # here take effect on container restart — no rebuild needed.
    env_file:
      - .env

    # Apply pending Drizzle migrations before starting the Next server.
    # `migrate.mjs` is idempotent (drizzle records applied migrations in
    # __drizzle_migrations), so this is a no-op when nothing is pending.
    # If migrations fail the container exits non-zero and Dokploy keeps the
    # previous version healthy via `restart: unless-stopped`.
    command: sh -c "node scripts/migrate.mjs && node server.js"

    # Cloudflare Tunnel hits this host:port pair.
    ports:
      - "3002:3000"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

    networks:
      - dokploy-network

networks:
  # Created by Dokploy on first install. `external: true` means compose won't
  # try to recreate it. If you're testing this locally without Dokploy, run:
  #   docker network create dokploy-network
  dokploy-network:
    external: true
